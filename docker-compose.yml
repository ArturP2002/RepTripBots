# Локальный PostgreSQL для разработки RepTrip
services:
  db:
    image: postgres:16-alpine
    container_name: reptrip_postgres
    environment:
      POSTGRES_USER: reptrip
      POSTGRES_PASSWORD: reptrip
      POSTGRES_DB: reptrip
    ports:
      # 5433 снаружи, чтобы не конфликтовать с локальным Homebrew Postgres на 5432
      - "5433:5432"
    volumes:
      - reptrip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reptrip -d reptrip"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reptrip_pgdata:
